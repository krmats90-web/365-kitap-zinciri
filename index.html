<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292929"><meta name="description" content="Her gün 25 sayfa oku, 365 günlük zincirini koru."><link rel="manifest" href="manifest.webmanifest"><title>365 Gün Kitap Zinciri</title><style>
:root{--bg:#f7f5ee;--card:#fff;--ink:#292929;--muted:#777;--line:#ddd8cc;--done:#292929;--today:#d9b45b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 34px}.hero{padding:8px 4px 16px}.hero h1{font-size:28px;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 14px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.progress{height:9px;background:#e5e1d7;border-radius:99px;overflow:hidden;margin:8px 0 16px}.bar{height:100%;width:0;background:var(--ink);transition:.2s}.toolbar{display:flex;gap:8px;margin-bottom:16px}.toolbar button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:650}.month{margin:18px 0}.month h2{font-size:18px;margin:0 0 8px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:var(--muted);padding:3px}.day{min-width:0;aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-weight:650;font-size:12px}.day.done{background:var(--done);color:#fff;border-color:var(--done)}.day.today{outline:3px solid var(--today);outline-offset:1px}.day.future{opacity:.45}.legend{font-size:12px;color:var(--muted);margin-top:12px}.install{display:none;margin:0 0 16px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:420px){.hero h1{font-size:25px}.stats{gap:6px}.stat{padding:10px 8px}.stat b{font-size:19px}.day{font-size:11px}}
</style></head><body><main><section class="hero"><h1>📚 365 Gün Kitap Zinciri</h1><p>Her gün <b>25 sayfa</b> oku. Zinciri bozma.</p></section><button id="install" class="install">📲 Ana ekrana uygulama olarak ekle</button><section class="stats"><div class="stat"><b id="completed">0</b><span>Tamamlanan gün</span></div><div class="stat"><b id="streak">0</b><span>Mevcut seri</span></div><div class="stat"><b id="pages">0</b><span>Okunan hedef sayfa</span></div></section><div class="progress"><div id="bar" class="bar"></div></div><div class="toolbar"><button id="todayBtn">Bugüne git</button><button id="resetBtn">Sıfırla</button></div><div id="calendar"></div><div class="legend">● Koyu: tamamlandı &nbsp; ◉ Sarı çerçeve: bugün &nbsp; Soluk: gelecek gün</div><div class="foot">Başlangıç: 3 Ekim 2026 · Bitiş: 2 Ekim 2027</div></main><script>
const START=new Date(2026,9,3), DAYS=365, KEY='kitap-zinciri-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
const names=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const dateAt=i=>new Date(START.getFullYear(),START.getMonth(),START.getDate()+i);
function render(){const cal=document.getElementById('calendar');cal.innerHTML='';let monthKey='';let grid;
for(let i=0;i<DAYS;i++){const d=dateAt(i), key=`${d.getFullYear()}-${d.getMonth()}`;
if(key!==monthKey){monthKey=key;const sec=document.createElement('section');sec.className='month';const h=document.createElement('h2');h.textContent=`${names[d.getMonth()]} ${d.getFullYear()}`;sec.appendChild(h);const w=document.createElement('div');w.className='week';['P','S','Ç','P','C','C','P'].forEach(x=>{const e=document.createElement('div');e.textContent=x;w.appendChild(e)});sec.appendChild(w);grid=document.createElement('div');grid.className='grid';const monday=(d.getDay()+6)%7;for(let j=0;j<monday;j++)grid.appendChild(document.createElement('span'));sec.appendChild(grid);cal.appendChild(sec)}
const b=document.createElement('button');b.className='day';b.textContent=d.getDate();const k=iso(d);if(state[k])b.classList.add('done');if(k===iso(today))b.classList.add('today');if(d>today)b.classList.add('future');b.title=`${d.getDate()} ${names[d.getMonth()]} ${d.getFullYear()}`;b.onclick=()=>{state[k]=!state[k];localStorage.setItem(KEY,JSON.stringify(state));render()};grid.appendChild(b)}
updateStats();}
function updateStats(){const done=Object.values(state).filter(Boolean).length;document.getElementById('completed').textContent=done;document.getElementById('pages').textContent=(done*25).toLocaleString('tr-TR');let s=0;for(let i=0;i<DAYS;i++){const d=dateAt(i);if(d>today)break;if(state[iso(d)])s++;else if(d<today)s=0;else s=0} // calculate consecutive run ending today; if today not done, ending yesterday
let end=today;if(!state[iso(today)])end=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);s=0;for(let i=0;i<DAYS;i++){const d=new Date(end.getFullYear(),end.getMonth(),end.getDate()-i);if(d<START||d>dateAt(DAYS-1)||!state[iso(d)])break;s++}document.getElementById('streak').textContent=s;document.getElementById('bar').style.width=`${Math.min(100,done/DAYS*100)}%`}
document.getElementById('todayBtn').onclick=()=>{const el=document.querySelector('.today');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('resetBtn').onclick=()=>{if(confirm('Tüm işaretleri silmek istediğine emin misin?')){state={};localStorage.removeItem(KEY);render()}};
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').style.display='block'});document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').style.display='none'}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
